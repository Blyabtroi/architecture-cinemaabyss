{{- if .Values.proxyService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: proxy-service
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.proxyService.replicas }}
  selector:
    matchLabels:
      app: proxy-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: proxy-service
    spec:
      containers:
      - name: proxy-service
        image: "{{ .Values.proxyService.image.repository }}:{{ .Values.proxyService.image.tag }}"
        ports:
        - containerPort: {{ .Values.proxyService.containerPort }}
        env:
{{- range .Values.proxyService.env }}
        - name: {{ .name }}
          value: {{ .value }}
{{- end }}
        resources:
          requests:
            memory: {{ .Values.proxyService.resources.requests.memory }}
            cpu: {{ .Values.proxyService.resources.requests.cpu }}
          limits:
            memory: {{ .Values.proxyService.resources.limits.memory }}
            cpu: {{ .Values.proxyService.resources.limits.cpu }}
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: proxy-service
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app: proxy-service
  ports:
    - protocol: TCP
      port: {{ .Values.proxyService.servicePort }}
      targetPort: {{ .Values.proxyService.containerPort }}
{{- end }}
