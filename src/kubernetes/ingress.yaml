apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss-ingress
  namespace: cinemaabyss
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  ingressClassName: nginx
  rules:
  - host: cinemaabyss.example.com
    http:
      paths:
      - path: /api/users
        pathType: Prefix
        backend:
          service:
            name: monolith
            port:
              number: 8080
      - path: /api/movies
        pathType: Prefix
        backend:
          service:
            name: movies-service
            port:
              number: 8081
      - path: /api/events
        pathType: Prefix
        backend:
          service:
            name: events-service
            port:
              number: 8082
      - path: /api/payments
        pathType: Prefix
        backend:
          service:
            name: monolith
            port:
              number: 8080
      - path: /api/subscriptions
        pathType: Prefix
        backend:
          service:
            name: monolith
            port:
              number: 8080
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: monolith
            port:
              number: 8080
